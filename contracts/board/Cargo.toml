[package]
name = "proof-courier-board"
version = "0.2.0"
edition = "2021"
description = "Open proof bounties on NEAR: any account commits to a Lean proof, reveals it, the on-chain Lean kernel checks it, the first valid reveal is paid"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# standalone crate, not a member of another workspace
[workspace]
