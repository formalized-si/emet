[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
description = "Lean 4 kernel (nanoda_lib) with a pinned, on-chain-checked base environment and per-theorem delta checks"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
nanoda_lib = { path = "vendor/nanoda_lib" }
serde_json = "1"
hex = "0.4"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode"] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
debug = false
panic = "abort"
overflow-checks = true

# standalone: not a member of the contracts/ workspace
[workspace]
